/**:
  ros__parameters:
    # These entries define the per-limb joint suffixes and limb prefixes.
    # When concatenated as "<prefix>_<joint>", the resulting joint list must
    # match the exact order used in controllers.yaml.
    joints:
      - haa_joint
      - hfe_joint
      - kfe_joint
    limb_prefixes:
      - fr
      - fl
      - br
      - bl

    # Lengths of shoulder (l1), femur (l2) and tibia (l3) links
    l1_len: 0.02980  # hip offset   (m)
    l2_len: 0.09606  # femur length (m)
    l3_len: 0.09750  # tibia Length (m)

    # Home position
    home_x: 0.0
    home_y: 0.0298
    home_z: -0.14

locomotion_commander:
  ros__parameters:
    limb_info: # needed to account for inversions
      fr:
        is_right: true
        is_back: false
      fl:
        is_right: false
        is_back: false
      br:
        is_right: true
        is_back: true
      bl:
        is_right: false
        is_back: true

    command_dispatch_frequency: 100.0  #Hz

gait_planner:
  ros__parameters:
    control_loop_frequency: 100.0  # Hz

    # Trot gait parameters
    step_height: 0.035     # foot lift height during swing  (m)
    swing_duration: 0.15   # time for swing phase           (s)
    stance_duration: 0.25  # time for stance phase          (s); duty factor=0.64

    # Hip positions relative to body center in robot frame (x=forward, y=left)
    # Magnitudes sourced from leg_x/leg_y in robot.urdf.xacro
    limb_info:
      fr:
        hip_x:  0.0828
        hip_y: -0.0560
      fl:
        hip_x:  0.0828
        hip_y:  0.0560
      br:
        hip_x: -0.0828
        hip_y: -0.0560
      bl:
        hip_x: -0.0828
        hip_y:  0.0560
