# Hardware configuration for the physical robot.
# Loaded by StsSystemInterface::on_init() via the motor_params_path URDF param.

hardware:
  serial_port: /dev/ttyUSB0
  baud_rate: 1000000           # 1Mbps. Serial communication speed between your computer and the servo bu
  max_velocity_rad_per_s: 0.5  # Software velocity clamp: max rad/s any joint can move per write() cycle.
  servo_speed_units: 200       # Additional ardware-enforced speed cap on top of the software clamp above.

# Per-joint motor wiring.
#
# motor_id:     ID burned onto the servo
# direction:    +1 or -1. Flips motor direction
# offset_ticks: 0-4095. Value where the joint is at URDF zero (0 rad).

joints:
  fr_haa_joint: { motor_id: 11,  direction:  +1, offset_ticks: 2048 }
  fr_hfe_joint: { motor_id: 12,  direction:  +1, offset_ticks: 2048 }
  fr_kfe_joint: { motor_id: 13,  direction:  +1, offset_ticks: 2048 }

  fl_haa_joint: { motor_id: 21,  direction:  +1, offset_ticks: 2048 }
  fl_hfe_joint: { motor_id: 22,  direction:  +1, offset_ticks: 2048 }
  fl_kfe_joint: { motor_id: 23,  direction:  +1, offset_ticks: 2048 }

  br_haa_joint: { motor_id: 31,  direction:  +1, offset_ticks: 2048 }
  br_hfe_joint: { motor_id: 32,  direction:  +1, offset_ticks: 2048 }
  br_kfe_joint: { motor_id: 33,  direction:  +1, offset_ticks: 2048 }

  bl_haa_joint: { motor_id: 41, direction:  +1, offset_ticks: 2048 }
  bl_hfe_joint: { motor_id: 42, direction:  +1, offset_ticks: 2048 }
  bl_kfe_joint: { motor_id: 43, direction:  +1, offset_ticks: 2048 }
