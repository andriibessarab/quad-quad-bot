site_name: Quad-Quad Bot
site_description: Documentation for an ongoing project building a robot that is both quad-ruped and quad-copter.
site_author: Andrii Bessarab

docs_dir: .
site_dir: ../site

theme:
  name: material
  logo: assets/images/logo.png
  favicon: assets/images/logo.png
  features:
    - navigation.sections
    - navigation.indexes
  palette:
    - scheme: slate
  icon:
    repo: fontawesome/brands/github

repo_url: https://github.com/andriibessarab/quad-quad-bot
repo_name: See on GitHub

nav:
  - Home: index.md
  - Engineering:
    - engineering/index.md
    - Mechanical:
      - engineering/mechanical/index.md
      - CAD: engineering/mechanical/cad.md
      - Manufacturing: engineering/mechanical/manufacturing.md
    - Electrical:
      - engineering/electrical/index.md
      - Power: engineering/electrical/power.md
      - Wiring: engineering/electrical/wiring.md
      - Electronics: engineering/electrical/electronics.md
    - Software:
      - engineering/software/index.md
      - Conventions: engineering/software/conventions.md
      - Kinematics: engineering/software/kinematics.md
      - Gait: engineering/software/gait.md
      - Architecture: engineering/software/architecture.md
      - URDF / Xacro: engineering/software/urdf.md
      - Simulation: engineering/software/simulation.md
      - Hardware Interface: engineering/software/hardware_interface.md
    - BOM: engineering/bom.md

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
      fallback_to_build_date: true
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid-init.js
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/logo-tweak.css
